services:
  portal:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      FLASK_APP: wsgi.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: getraf
      POSTGRES_USER: getraf
      POSTGRES_PASSWORD: getraf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getraf"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: getraf
      MB_DB_PASS: getraf
      MB_DB_HOST: postgres
      MB_SITE_LOCALE: pt
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python worker.py
    env_file: .env
    environment:
      FLASK_APP: wsgi.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
