services:
  portal:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: getraf
      POSTGRES_USER: getraf
      POSTGRES_PASSWORD: getraf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: getraf
      MB_DB_PASS: getraf
      MB_DB_HOST: postgres
      MB_SITE_LOCALE: pt
    depends_on:
      - postgres

  worker:
    build: .
    command: python worker.py
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
